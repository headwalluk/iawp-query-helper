name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Third-party actions are pinned to a commit SHA, with the release it is as a comment.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Plugin version: ${VERSION}"

      - name: Verify version numbers agree
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          # A header and constant that disagree make the updater advertise
          # a permanent phantom update, so refuse to build.
          HEADER_VERSION=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' iawp-query-helper.php | head -1 | tr -d '[:space:]')
          CONSTANT_VERSION=$(sed -n "s/^define( 'IAWPQH_VERSION', '\(.*\)' );[[:space:]]*$/\1/p" iawp-query-helper.php | head -1 | tr -d '[:space:]')

          echo "Git tag ................ ${TAG_VERSION}"
          echo "Plugin header .......... ${HEADER_VERSION}"
          echo "IAWPQH_VERSION ...... ${CONSTANT_VERSION}"

          VERSION_MISMATCH=0
          for CANDIDATE_VERSION in "${HEADER_VERSION}" "${CONSTANT_VERSION}"; do
            if [ "${CANDIDATE_VERSION}" != "${TAG_VERSION}" ]; then
              VERSION_MISMATCH=1
            fi
          done

          if [ "${VERSION_MISMATCH}" -ne 0 ]; then
            echo "::error::Version mismatch. The plugin header and IAWPQH_VERSION must both read ${TAG_VERSION}."
            exit 1
          fi

          echo "All version numbers agree on ${TAG_VERSION}."

      - name: Prepare plugin directory
        run: |
          mkdir -p build
          rsync -av --exclude-from=.distignore ./ build/iawp-query-helper/

      - name: Build release zips
        # Build the versioned zip once, then copy it to the generic
        # filename so both artifacts are guaranteed byte-identical
        # (same SHA256, just different filenames).
        run: |
          cd build
          zip -r iawp-query-helper-${{ steps.get_version.outputs.version }}.zip iawp-query-helper/
          cp iawp-query-helper-${{ steps.get_version.outputs.version }}.zip iawp-query-helper.zip
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          files: |
            build/iawp-query-helper-${{ steps.get_version.outputs.version }}.zip
            build/iawp-query-helper.zip
          body: |
            **IAWP Query Helper v${{ steps.get_version.outputs.version }}**

            Read-only REST routes and Abilities for querying Independent Analytics, built for AI agents.

            Download `iawp-query-helper.zip` and install via WordPress admin (Plugins → Add New → Upload Plugin), or upload to your `wp-content/plugins/` directory.

            Sites running a previous version will receive this update automatically via the in-plugin GitHub updater.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
